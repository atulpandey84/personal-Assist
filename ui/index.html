<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js Library for 3D Female Persona Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="assistant-container">
            <div class="avatar-box" id="avatar-container">
                <!-- WebGL 3D Canvas for Interactive Female Persona -->
                <canvas id="avatar-3d-canvas" width="220" height="220"></canvas>
            </div>
            <div class="status-indicator" id="status">Ready to help</div>
            <div class="chat-display" id="chat">
                <p>Welcome. I am your Multi-Agent Assistant. You can speak to me or type below.</p>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="input-box" placeholder="Type your message here...">
            <button id="send-btn">Send</button>
            <button id="mic-btn" class="mic-inactive">🎙️ Listen</button>
        </div>
    </div>
    <script src="vrmManager.js"></script>
    <script src="script.js"></script>
</body>
</html>
